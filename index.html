<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#12110e" />
    <meta name="color-scheme" content="dark" />
    <title>World Simulator</title>
  </head>
  <body>
    <div id="app">
      <div id="world" class="world-host" aria-label="Generated world map"></div>
      <div id="labels" class="labels" aria-hidden="true"></div>
      <div id="ui" class="ui"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="boot" class="boot">
        <div class="boot-mark" aria-hidden="true"></div>
        <p class="boot-text">Loading World Simulator</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
