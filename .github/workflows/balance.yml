name: balance

# The acceptance harness: 20 deterministic seeds x 400 simulated years through the real pipeline,
# then one 500-year Large-preset run for the Stage 5 memory/leak gate. GitHub Actions is the only
# machine that does this work; the 2-vCPU development box must not.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seeds:
        description: Seeds to simulate
        default: '20'
      years:
        description: Simulated years per seed
        default: '400'

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:tools
      - name: Run harness
        run: |
          node --expose-gc dist-tools/tools.js balance \
            --seeds=${{ github.event.inputs.seeds || '20' }} \
            --years=${{ github.event.inputs.years || '400' }} \
            --preset=medium --out=balance.json
      - name: Acceptance summary (population band, failures)
        run: node scripts/assert-balance.mjs balance.json
      - name: Large-world 500-year stress (S5-A3)
        run: |
          node --expose-gc dist-tools/tools.js balance \
            --seeds=1 --years=500 --preset=large --out=stress.json
          node scripts/assert-stress.mjs stress.json 1536
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-${{ github.sha }}
          path: |
            balance.json
            stress.json
          retention-days: 30
